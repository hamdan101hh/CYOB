<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — cyob</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/3.1.0/tabler-icons.min.css">
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <a href="index.html" class="logo">
      <div class="logo-mark">cy</div>
      <div class="logo-text">
        <span class="name">cyob</span>
        <span class="logo-sub">strategic intelligence</span>
      </div>
    </a>
    <div class="topbar-meta">
      <a href="index.html" class="btn btn-sm">Back home</a>
    </div>
  </div>
</div>

<section style="padding: 100px 0;">
  <div class="wrap-sm">
    <div class="card card-elevated" style="padding: 40px; max-width: 460px; margin: 0 auto;">

      <!-- LOGIN STEP -->
      <div id="loginStep">
        <p class="eyebrow">Welcome back</p>
        <h1 style="font-size: 28px; margin-bottom: 20px;">Log in to your war room</h1>

        <div class="field">
          <label class="label">Email</label>
          <input class="input input-lg" id="loginEmail" type="email" placeholder="you@company.com" autocomplete="email">
        </div>

        <div class="field">
          <label class="label">Password</label>
          <input class="input input-lg" id="loginPass" type="password" placeholder="Your password" autocomplete="current-password">
        </div>

        <p class="muted-sm" style="font-size: 11.5px; color: var(--text-4); margin-bottom: 20px;">
          <i class="ti ti-shield-check" style="vertical-align: -1px; color: var(--green);"></i> Secure · password + email code on new devices
        </p>

        <button class="btn btn-primary btn-block btn-lg" id="loginBtn">
          Log in <i class="ti ti-arrow-right"></i>
        </button>

        <div class="flex justify-between mt-4" style="margin-top: 16px;">
          <button class="btn btn-ghost btn-sm" onclick="forgot()">Forgot password</button>
          <a href="index.html" class="btn btn-ghost btn-sm">Create account</a>
        </div>
      </div>

      <!-- OTP STEP -->
      <div id="otpStep" class="hidden">
        <p class="eyebrow">New device detected</p>
        <h1 style="font-size: 24px; margin-bottom: 8px;">Verify it's you</h1>
        <p class="muted-sm" style="margin-bottom: 8px;">Six digits sent to <span id="emailEcho" style="color: var(--text);"></span></p>
        <p class="muted-sm" style="margin-bottom: 4px; font-size: 11px; color: var(--green);">
          <i class="ti ti-info-circle" style="vertical-align: -1px;"></i> Demo — use any 6 digits
        </p>
        <div class="otp-row" id="otpRow">
          <input type="text" maxlength="1" inputmode="numeric">
          <input type="text" maxlength="1" inputmode="numeric">
          <input type="text" maxlength="1" inputmode="numeric">
          <input type="text" maxlength="1" inputmode="numeric">
          <input type="text" maxlength="1" inputmode="numeric">
          <input type="text" maxlength="1" inputmode="numeric">
        </div>
        <button class="btn btn-primary btn-block btn-lg" id="verifyBtn">
          Verify <i class="ti ti-check"></i>
        </button>
        <div class="text-center mt-3">
          <button class="btn btn-ghost btn-sm" onclick="CYOB.toast('Code re-sent')">Resend code</button>
          <button class="btn btn-ghost btn-sm" onclick="backToLogin()">Use a different account</button>
        </div>
      </div>

    </div>

    <p class="text-center muted-sm mt-4" style="margin-top: 24px; font-size: 11.5px; color: var(--text-4);">
      <i class="ti ti-lock" style="vertical-align: -1px;"></i> Encrypted at rest · Supabase Auth · industry-standard security
    </p>
  </div>
</section>

<script src="app.js"></script>
<script>
  const otpInputs = document.querySelectorAll('#otpRow input');
  otpInputs.forEach((inp, idx) => {
    inp.addEventListener('input', e => {
      e.target.value = e.target.value.replace(/\D/g, '');
      if (e.target.value) inp.classList.add('filled');
      else inp.classList.remove('filled');
      if (e.target.value && idx < otpInputs.length - 1) otpInputs[idx + 1].focus();
    });
    inp.addEventListener('keydown', e => {
      if (e.key === 'Backspace' && !inp.value && idx > 0) otpInputs[idx - 1].focus();
    });
  });

  document.getElementById('loginBtn').addEventListener('click', () => {
    const email = document.getElementById('loginEmail').value;
    const pass = document.getElementById('loginPass').value;
    if (!email || !/^.+@.+\..+$/.test(email)) { CYOB.toast('Enter a valid email'); return; }
    if (!pass) { CYOB.toast('Enter your password'); return; }

    // Check if this is a "new device" — for demo, always show OTP
    document.getElementById('emailEcho').textContent = email;
    document.getElementById('loginStep').classList.add('hidden');
    document.getElementById('otpStep').classList.remove('hidden');
    CYOB.toast('Code sent · check inbox');
    setTimeout(() => otpInputs[0].focus(), 300);
    window._pendingEmail = email;
  });

  document.getElementById('verifyBtn').addEventListener('click', () => {
    const code = Array.from(otpInputs).map(i => i.value).join('');
    if (code.length !== 6) { CYOB.toast('Enter all 6 digits'); return; }
    CYOB.setUser(window._pendingEmail || 'user@cyob.live');
    CYOB.toast('Welcome back');
    setTimeout(() => {
      if (CYOB.plan) location.href = 'dashboard.html';
      else location.href = 'index.html';
    }, 800);
  });

  function backToLogin() {
    document.getElementById('otpStep').classList.add('hidden');
    document.getElementById('loginStep').classList.remove('hidden');
    otpInputs.forEach(i => { i.value = ''; i.classList.remove('filled'); });
  }
  function forgot() {
    CYOB.toast('Password reset link sent to your email · check inbox');
  }
  window.backToLogin = backToLogin;
  window.forgot = forgot;
</script>
</body>
</html>
